<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 196" width="100%" height="196" role="img" aria-label="srz - Distill webpages, books, files and streams with local LLMs">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="55%" stop-color="#151b23" />
      <stop offset="100%" stop-color="#1c1614" />
    </linearGradient>
    <linearGradient id="rustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b47" />
      <stop offset="50%" stop-color="#f74c00" />
      <stop offset="100%" stop-color="#b83200" />
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7b47" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <!-- Outer Card -->
  <rect x="4" y="4" width="732" height="188" rx="18" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5" />

  <!-- Left Emblem: Rust Gear + Book/Web Distillation Funnel -->
  <g transform="translate(110, 98)">
    <!-- Ambient Rust Glow -->
    <circle cx="0" cy="0" r="66" fill="#f74c00" opacity="0.10" />

    <!-- Rust Gear Teeth (12 teeth via rotated rects) -->
    <g fill="url(#rustGrad)">
      <rect x="-8.5" y="-72" width="17" height="144" rx="4" />
      <rect x="-8.5" y="-72" width="17" height="144" rx="4" transform="rotate(30)" />
      <rect x="-8.5" y="-72" width="17" height="144" rx="4" transform="rotate(60)" />
      <rect x="-8.5" y="-72" width="17" height="144" rx="4" transform="rotate(90)" />
      <rect x="-8.5" y="-72" width="17" height="144" rx="4" transform="rotate(120)" />
      <rect x="-8.5" y="-72" width="17" height="144" rx="4" transform="rotate(150)" />
    </g>

    <!-- Gear Outer Ring & Inner Core -->
    <circle cx="0" cy="0" r="61" fill="url(#rustGrad)" />
    <circle cx="0" cy="0" r="49" fill="#0f141b" stroke="#ff8c5a" stroke-width="1.5" stroke-opacity="0.45" />

    <!-- Gear Bolt Holes -->
    <g fill="#0d1117">
      <circle cx="0" cy="-55" r="2.8" />
      <circle cx="47.6" cy="-27.5" r="2.8" />
      <circle cx="47.6" cy="27.5" r="2.8" />
      <circle cx="0" cy="55" r="2.8" />
      <circle cx="-47.6" cy="27.5" r="2.8" />
      <circle cx="-47.6" cy="-27.5" r="2.8" />
    </g>

    <!-- Top Half of Emblem: Open Book / Web Document Pages -->
    <path d="M -28 -26 Q -14 -31 0 -23 Q 14 -31 28 -26 L 28 -3 Q 14 -8 0 0 Q -14 -8 -28 -3 Z"
          fill="#1e293b" stroke="#ff7b47" stroke-width="2" stroke-linejoin="round" />
    <line x1="0" y1="-23" x2="0" y2="0" stroke="#ff7b47" stroke-width="1.8" />
    <line x1="-21" y1="-18" x2="-6" y2="-15" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" />
    <line x1="-21" y1="-11" x2="-8" y2="-8" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" />
    <line x1="6" y1="-15" x2="21" y2="-18" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" />
    <line x1="8" y1="-8" x2="21" y2="-11" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" />

    <!-- Middle Distillation Funnel / Prism Arrow -->
    <polygon points="-22,4 22,4 7,16 -7,16" fill="url(#beamGrad)" opacity="0.85" />

    <!-- Bottom Half of Emblem: Distilled Summary Bullets -->
    <circle cx="-17" cy="24" r="2.3" fill="#38bdf8" />
    <rect x="-10" y="22" width="29" height="4" rx="2" fill="#e2e8f0" />

    <circle cx="-17" cy="32" r="2.3" fill="#ff7b47" />
    <rect x="-10" y="30" width="22" height="4" rx="2" fill="#94a3b8" />
  </g>

  <!-- Right Section: Minimalist Title & Tagline -->
  <g transform="translate(252, 0)">
    <text x="0" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="56" font-weight="800" fill="#f0f6fc" letter-spacing="-1">srz</text>
    <text x="2" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17.5" font-weight="500" fill="#c9d1d9">
      Distill <tspan fill="#ffffff" font-weight="700">webpages</tspan>, <tspan fill="#ffffff" font-weight="700">books</tspan>, <tspan fill="#ffffff" font-weight="700">files</tspan> &amp; <tspan fill="#ffffff" font-weight="700">streams</tspan> with local LLMs.
    </text>
  </g>
</svg>
