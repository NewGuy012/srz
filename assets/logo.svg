<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 220" width="100%" height="220" role="img" aria-label="srz - Rust CLI for Summarizing Webpages, Books, and Streams">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="55%" stop-color="#151b23" />
      <stop offset="100%" stop-color="#1c1614" />
    </linearGradient>
    <linearGradient id="rustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b47" />
      <stop offset="50%" stop-color="#f74c00" />
      <stop offset="100%" stop-color="#b83200" />
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7b47" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Card -->
  <rect x="4" y="4" width="772" height="212" rx="18" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5" />

  <!-- Subtle Grid Accent -->
  <g stroke="#21262d" stroke-width="1" opacity="0.55">
    <line x1="230" y1="4" x2="230" y2="216" />
    <line x1="4" y1="110" x2="230" y2="110" />
  </g>

  <!-- Left Emblem: Rust Gear + Book/Web Distillation Funnel -->
  <g transform="translate(118, 110)">
    <!-- Ambient Rust Glow -->
    <circle cx="0" cy="0" r="68" fill="#f74c00" opacity="0.10" />

    <!-- Rust Gear Teeth (12 teeth via rotated rects) -->
    <g fill="url(#rustGrad)">
      <rect x="-9" y="-76" width="18" height="152" rx="4" />
      <rect x="-9" y="-76" width="18" height="152" rx="4" transform="rotate(30)" />
      <rect x="-9" y="-76" width="18" height="152" rx="4" transform="rotate(60)" />
      <rect x="-9" y="-76" width="18" height="152" rx="4" transform="rotate(90)" />
      <rect x="-9" y="-76" width="18" height="152" rx="4" transform="rotate(120)" />
      <rect x="-9" y="-76" width="18" height="152" rx="4" transform="rotate(150)" />
    </g>

    <!-- Gear Outer Ring & Inner Core -->
    <circle cx="0" cy="0" r="64" fill="url(#rustGrad)" />
    <circle cx="0" cy="0" r="52" fill="#0f141b" stroke="#ff8c5a" stroke-width="1.5" stroke-opacity="0.45" />

    <!-- Gear Bolt Holes -->
    <g fill="#0d1117">
      <circle cx="0" cy="-58" r="3" />
      <circle cx="50" cy="-29" r="3" />
      <circle cx="50" cy="29" r="3" />
      <circle cx="0" cy="58" r="3" />
      <circle cx="-50" cy="29" r="3" />
      <circle cx="-50" cy="-29" r="3" />
    </g>

    <!-- Top Half of Emblem: Open Book / Web Document Pages -->
    <path d="M -30 -28 Q -15 -33 0 -25 Q 15 -33 30 -28 L 30 -4 Q 15 -9 0 -1 Q -15 -9 -30 -4 Z"
          fill="#1e293b" stroke="#ff7b47" stroke-width="2" stroke-linejoin="round" />
    <line x1="0" y1="-25" x2="0" y2="-1" stroke="#ff7b47" stroke-width="1.8" />
    <!-- Text lines on left & right pages -->
    <line x1="-23" y1="-20" x2="-6" y2="-17" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" />
    <line x1="-23" y1="-13" x2="-8" y2="-10" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" />
    <line x1="6" y1="-17" x2="23" y2="-20" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" />
    <line x1="8" y1="-10" x2="23" y2="-13" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" />

    <!-- Middle Distillation Funnel / Prism Arrow -->
    <polygon points="-24,3 24,3 8,16 -8,16" fill="url(#beamGrad)" opacity="0.85" />

    <!-- Bottom Half of Emblem: Distilled Summary Bullets -->
    <circle cx="-18" cy="24" r="2.4" fill="#38bdf8" />
    <rect x="-11" y="22" width="31" height="4" rx="2" fill="#e2e8f0" />

    <circle cx="-18" cy="33" r="2.4" fill="#ff7b47" />
    <rect x="-11" y="31" width="24" height="4" rx="2" fill="#94a3b8" />
  </g>

  <!-- Right Section: Brand Typography, Tagline & Feature Pills -->
  <g transform="translate(262, 0)">
    <!-- Terminal Prompt + Title -->
    <text x="0" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="48" font-weight="800" fill="#ff7b47">&gt;_</text>
    <text x="68" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="54" font-weight="800" fill="#f0f6fc" letter-spacing="-1">srz</text>

    <!-- Subtitle Badge -->
    <rect x="184" y="46" width="136" height="26" rx="13" fill="#231815" stroke="#f74c00" stroke-width="1.2" />
    <text x="252" y="63" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ff8c5a" letter-spacing="0.6">RUST 2024 CLI</text>

    <!-- Tagline -->
    <text x="2" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500" fill="#c9d1d9">
      Distill <tspan fill="#ffffff" font-weight="700">webpages</tspan>, <tspan fill="#ffffff" font-weight="700">books</tspan>, <tspan fill="#ffffff" font-weight="700">files</tspan> &amp; <tspan fill="#ffffff" font-weight="700">streams</tspan> with local LLMs.
    </text>

    <!-- Signal Flow Mini-Pipeline -->
    <text x="2" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" fill="#8b949e">
      URL | Book | File | Stdin  ───►  Grounded Context  ───►  Live SSE Markdown
    </text>

    <!-- Bottom Pill Badges -->
    <g transform="translate(0, 158)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="136" height="28" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <circle cx="14" cy="14" r="4" fill="#f74c00" />
      <text x="26" y="18" fill="#e6edf3">Zero API Keys</text>

      <!-- Pill 2 -->
      <rect x="148" y="0" width="152" height="28" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <circle cx="162" cy="14" r="4" fill="#38bdf8" />
      <text x="174" y="18" fill="#e6edf3">OpenAI SSE Stream</text>

      <!-- Pill 3 -->
      <rect x="312" y="0" width="154" height="28" rx="7" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <circle cx="326" cy="14" r="4" fill="#eab308" />
      <text x="338" y="18" fill="#e6edf3">Embedded DuckDB</text>
    </g>
  </g>
</svg>
