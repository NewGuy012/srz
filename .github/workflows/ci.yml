name: CI & Security

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - master
  schedule:
    # Weekly security scan on Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test & Lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Set up sccache
        uses: mozilla/sccache-action@v0.0.8

      - name: Configure sccache
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev build-essential cmake

      - name: Check code formatting (rustfmt)
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Check documentation links & warnings
        if: matrix.os == 'ubuntu-latest'
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features

      - name: Validate Crates.io packaging (dry-run)
        if: matrix.os == 'ubuntu-latest'
        run: cargo publish --dry-run

      - name: Run cargo clippy (warnings denied)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run cargo test
        run: cargo test --all-targets

      - name: Run cargo doc tests
        run: cargo test --doc

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  security-audit:
    name: Dependency Security & License Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run cargo-deny checks
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run cargo audit
        run: cargo audit

  ci-status:
    name: All CI Checks Passed
    needs: [test, security-audit]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify all required checks succeeded
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.security-audit.result }}" != "success" ]; then
            echo "::error::One or more upstream CI jobs failed."
            exit 1
          fi
          echo "✔ All test, lint, doc, packaging, and security checks passed successfully!"
