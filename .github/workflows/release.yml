name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (validate build and package without publishing)'
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-version:
    name: Verify Tag & Cargo.toml Version Match
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      clean_version: ${{ steps.version.outputs.clean_version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify Git Tag matches Cargo.toml
        id: version
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [[ "${REF}" != refs/tags/v* ]] && [ "${DRY_RUN}" != "true" ]; then
            echo "::error::Manual non-dry-run releases must be dispatched from a 'v*' tag (got '${REF}')."
            exit 1
          fi

          CARGO_VER=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "srz") | .version')
          if [[ "${REF}" == refs/tags/v* ]]; then
            TAG_VER="${REF_NAME#v}"
            if [ "$CARGO_VER" != "$TAG_VER" ]; then
              echo "::error::Tag version ($TAG_VER) does not match Cargo.toml version ($CARGO_VER)!"
              exit 1
            fi
            echo "Verified: Git tag ($TAG_VER) matches Cargo.toml version ($CARGO_VER)"
          else
            echo "Workflow dispatched manually on non-tag ref (${REF}). Using Cargo.toml version: v${CARGO_VER} (dry-run only)."
          fi

          if [[ "$CARGO_VER" == *-* ]]; then
            IS_PRERELEASE="true"
          else
            IS_PRERELEASE="false"
          fi

          {
            echo "version=v${CARGO_VER}"
            echo "clean_version=${CARGO_VER}"
            echo "is_prerelease=${IS_PRERELEASE}"
          } >> "$GITHUB_OUTPUT"

  verify-tests:
    name: Pre-Release Test, Lint & Security Gate
    needs: verify-version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config build-essential cmake

      - name: Verify formatting, clippy, and test suite
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          cargo test --locked --doc

      - name: Run cargo-deny security & license checks
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  build-release:
    name: Build release (${{ matrix.target }})
    needs: verify-version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config build-essential cmake

      - name: Build release binary
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET"

      - name: Package asset & generate completions (Unix)
        if: matrix.archive == 'tar.gz'
        env:
          VERSION: ${{ needs.verify-version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          ARCHIVE_VERSION="srz-${VERSION}-${TARGET}.tar.gz"
          ARCHIVE_LATEST="srz-${TARGET}.tar.gz"

          STAGE_DIR="staging-${TARGET}"
          mkdir -p "${STAGE_DIR}/completions"

          cp "target/${TARGET}/release/srz" "${STAGE_DIR}/"
          cp README.md LICENSE "${STAGE_DIR}/"

          # Generate shell completions using the built release binary
          "${STAGE_DIR}/srz" completions bash > "${STAGE_DIR}/completions/srz.bash"
          "${STAGE_DIR}/srz" completions zsh > "${STAGE_DIR}/completions/_srz"
          "${STAGE_DIR}/srz" completions fish > "${STAGE_DIR}/completions/srz.fish"
          "${STAGE_DIR}/srz" completions powershell > "${STAGE_DIR}/completions/_srz.ps1"
          "${STAGE_DIR}/srz" completions elvish > "${STAGE_DIR}/completions/srz.elv"

          # Create archive with root binary and bundled documentation / completions
          tar -czf "${ARCHIVE_VERSION}" -C "${STAGE_DIR}" srz README.md LICENSE completions
          cp "${ARCHIVE_VERSION}" "${ARCHIVE_LATEST}"

          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARCHIVE_VERSION}" > "${ARCHIVE_VERSION}.sha256"
            sha256sum "${ARCHIVE_LATEST}" > "${ARCHIVE_LATEST}.sha256"
          else
            shasum -a 256 "${ARCHIVE_VERSION}" > "${ARCHIVE_VERSION}.sha256"
            shasum -a 256 "${ARCHIVE_LATEST}" > "${ARCHIVE_LATEST}.sha256"
          fi

      - name: Package asset & generate completions (Windows)
        if: matrix.archive == 'zip'
        shell: bash
        env:
          VERSION: ${{ needs.verify-version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          ARCHIVE_VERSION="srz-${VERSION}-${TARGET}.zip"
          ARCHIVE_LATEST="srz-${TARGET}.zip"

          STAGE_DIR="staging-${TARGET}"
          mkdir -p "${STAGE_DIR}/completions"

          cp "target/${TARGET}/release/srz.exe" "${STAGE_DIR}/"
          cp README.md LICENSE "${STAGE_DIR}/"

          # Generate shell completions using the built release binary
          "./${STAGE_DIR}/srz.exe" completions bash > "${STAGE_DIR}/completions/srz.bash"
          "./${STAGE_DIR}/srz.exe" completions zsh > "${STAGE_DIR}/completions/_srz"
          "./${STAGE_DIR}/srz.exe" completions fish > "${STAGE_DIR}/completions/srz.fish"
          "./${STAGE_DIR}/srz.exe" completions powershell > "${STAGE_DIR}/completions/_srz.ps1"
          "./${STAGE_DIR}/srz.exe" completions elvish > "${STAGE_DIR}/completions/srz.elv"

          ROOT_DIR="$(pwd)"
          (cd "${STAGE_DIR}" && 7z a "${ROOT_DIR}/${ARCHIVE_VERSION}" srz.exe README.md LICENSE completions)
          cp "${ARCHIVE_VERSION}" "${ARCHIVE_LATEST}"

          sha256sum "${ARCHIVE_VERSION}" > "${ARCHIVE_VERSION}.sha256"
          sha256sum "${ARCHIVE_LATEST}" > "${ARCHIVE_LATEST}.sha256"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-${{ matrix.target }}
          path: |
            srz-*.tar.gz
            srz-*.zip
            srz-*.sha256
          if-no-files-found: error

  publish-release-notes:
    name: Publish GitHub Release Notes
    needs: [verify-version, verify-tests, build-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Existing Release & Extract Release Notes
        id: changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify-version.outputs.version }}
        run: |
          # Check if a release already exists on GitHub with non-empty notes
          if EXISTING_BODY=$(gh release view "${VERSION}" --json body -q .body 2>/dev/null); then
            TRIMMED_BODY=$(printf '%s' "${EXISTING_BODY}" | tr -d '[:space:]')
            if [ -n "${TRIMMED_BODY}" ]; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "Existing release body detected on GitHub for ${VERSION}. Leaving release page untouched."
              exit 0
            fi
          fi

          echo "exists=false" >> "$GITHUB_OUTPUT"

          mkdir -p dist
          echo "Extracting release notes for ${VERSION} from docs/src/changelog.md..."
          awk -v ver="${VERSION}" '
            $0 == "## " ver { found=1; next }
            found && /^## / { exit }
            found && /^---/ { exit }
            found { print }
          ' docs/src/changelog.md > dist/release_notes.md

          TRIMMED_NOTES=$(tr -d '[:space:]' < dist/release_notes.md)
          if [ -n "${TRIMMED_NOTES}" ]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release with Changelog Notes
        if: steps.changelog.outputs.exists != 'true' && steps.changelog.outputs.has_notes == 'true'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.verify-version.outputs.version }}
          name: ${{ needs.verify-version.outputs.version }}
          body_path: dist/release_notes.md
          prerelease: ${{ needs.verify-version.outputs.is_prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release with Auto-generated Notes
        if: steps.changelog.outputs.exists != 'true' && steps.changelog.outputs.has_notes != 'true'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.verify-version.outputs.version }}
          name: ${{ needs.verify-version.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ needs.verify-version.outputs.is_prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  attach-release-assets:
    name: Attach Assets & Attestations to Release
    needs: [verify-version, verify-tests, build-release, publish-release-notes]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download all release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Generate Consolidated SHA256SUMS
        run: |
          cd dist
          sha256sum srz-*.tar.gz srz-*.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Generate Artifact Attestations (SLSA Provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/srz-*.tar.gz
            dist/srz-*.zip

      - name: Attach Compiled Binaries & Checksums
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.verify-version.outputs.version }}
          prerelease: ${{ needs.verify-version.outputs.is_prerelease == 'true' }}
          files: |
            dist/srz-*.tar.gz
            dist/srz-*.zip
            dist/srz-*.sha256
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crates-io:
    name: Publish to Crates.io
    needs: [verify-version, verify-tests, build-release, attach-release-assets]
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config build-essential cmake

      - name: Publish to Crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
          CLEAN_VERSION: ${{ needs.verify-version.outputs.clean_version }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::CRATES_IO_TOKEN secret is not set."
            exit 1
          fi
          if cargo publish --locked 2>&1 | tee publish.log; then
            echo "Successfully published to crates.io!"
          else
            if grep -iq "already exists on crates.io" publish.log; then
              echo "::notice::srz@${CLEAN_VERSION} is already published on crates.io. Skipping publish step."
              rm -f publish.log
              exit 0
            else
              echo "::error::cargo publish failed with an unexpected error."
              rm -f publish.log
              exit 1
            fi
          fi
          rm -f publish.log

  bump-homebrew:
    name: Bump Homebrew Formula
    needs: [verify-version, verify-tests, build-release, attach-release-assets]
    if: startsWith(github.ref, 'refs/tags/v') && needs.verify-version.outputs.is_prerelease != 'true' && inputs.dry_run != true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check if HOMEBREW_TAP_TOKEN is configured
        id: check-token
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::HOMEBREW_TAP_TOKEN secret is not set. Skipping Homebrew formula bump."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release assets for checksum extraction
        if: steps.check-token.outputs.skip != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Update Homebrew formula in tap
        if: steps.check-token.outputs.skip != 'true'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.verify-version.outputs.clean_version }}
          TAG: ${{ needs.verify-version.outputs.version }}
        run: |
          echo "Updating Homebrew tap for srz v${VERSION} (${TAG})..."

          # Read checksums directly from downloaded build artifacts
          SHA_ARM64_MAC=$(awk '{print $1}' "dist/srz-${TAG}-aarch64-apple-darwin.tar.gz.sha256" | head -1)
          SHA_X86_LINUX=$(awk '{print $1}' "dist/srz-${TAG}-x86_64-unknown-linux-gnu.tar.gz.sha256" | head -1)
          SHA_ARM_LINUX=$(awk '{print $1}' "dist/srz-${TAG}-aarch64-unknown-linux-gnu.tar.gz.sha256" | head -1)

          if [ -z "$SHA_ARM64_MAC" ] || [ -z "$SHA_X86_LINUX" ] || [ -z "$SHA_ARM_LINUX" ]; then
            echo "::error::Could not extract all required sha256 checksums from local artifacts."
            exit 1
          fi

          echo "macOS aarch64 SHA256: ${SHA_ARM64_MAC}"
          echo "Linux x86_64  SHA256: ${SHA_X86_LINUX}"
          echo "Linux aarch64 SHA256: ${SHA_ARM_LINUX}"

          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${TAP_TOKEN}" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" clone "https://github.com/NewGuy012/homebrew-tap.git" tap
          cd tap

          mkdir -p Formula

          cat > Formula/srz.rb <<EOF
          class Srz < Formula
            desc "Fast, modular CLI to summarize webpages, documents, books, and live news using local LLMs"
            homepage "https://github.com/NewGuy012/srz"
            version "${VERSION}"
            license "BSD-3-Clause"

            on_macos do
              on_arm do
                url "https://github.com/NewGuy012/srz/releases/download/v#{version}/srz-v#{version}-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_ARM64_MAC}"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/NewGuy012/srz/releases/download/v#{version}/srz-v#{version}-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_X86_LINUX}"
              end
              on_arm do
                url "https://github.com/NewGuy012/srz/releases/download/v#{version}/srz-v#{version}-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_ARM_LINUX}"
              end
            end

            def install
              bin.install "srz"
              generate_completions_from_executable(bin/"srz", "completions")
            end

            test do
              assert_match "srz", shell_output("#{bin}/srz --version")
            end
          end
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TARGET_BRANCH=$(git branch --show-current)
          if [ -z "$TARGET_BRANCH" ]; then
            TARGET_BRANCH="main"
            git checkout -b main
          fi

          git add Formula/srz.rb
          if git diff --staged --quiet; then
            echo "Formula already up-to-date. No changes to commit."
          else
            git commit -m "Update srz formula to v${VERSION}"
            git -c "http.https://github.com/.extraheader=${AUTH_HEADER}" push origin "$TARGET_BRANCH"
            echo "Successfully updated Formula/srz.rb to v${VERSION} on branch ${TARGET_BRANCH}!"
          fi

  verify-attestation:
    name: Verify Release Checksums & SLSA Provenance
    needs: [verify-version, attach-release-assets]
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Download release assets & verify SHA256SUMS + SLSA attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.verify-version.outputs.version }}
        run: |
          mkdir -p verify-dist
          gh release download "$TAG" --repo "$REPO" --dir verify-dist
          cd verify-dist
          sha256sum -c SHA256SUMS
          for f in srz-*.tar.gz srz-*.zip; do
            gh attestation verify "$f" --repo "$REPO"
          done

  verify-release-install:
    name: Post-Release Installer & Upgrade Verification
    needs: [verify-version, attach-release-assets]
    if: startsWith(github.ref, 'refs/tags/v') && needs.verify-version.outputs.is_prerelease != 'true' && inputs.dry_run != true
    uses: ./.github/workflows/install-test.yml
