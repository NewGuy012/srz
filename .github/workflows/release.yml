name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (validate build and package without publishing)'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  verify-version:
    name: Verify Tag & Cargo.toml Version Match
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      clean_version: ${{ steps.version.outputs.clean_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Git Tag matches Cargo.toml
        id: version
        run: |
          CARGO_VER=$(cargo metadata --no-deps --format-version 1 | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_VER="${GITHUB_REF_NAME#v}"
            if [ "$CARGO_VER" != "$TAG_VER" ]; then
              echo "::error::Tag version ($TAG_VER) does not match Cargo.toml version ($CARGO_VER)!"
              exit 1
            fi
            echo "Verified: Git tag ($TAG_VER) matches Cargo.toml version ($CARGO_VER)"
            echo "version=v${TAG_VER}" >> $GITHUB_OUTPUT
            echo "clean_version=${TAG_VER}" >> $GITHUB_OUTPUT
          else
            echo "Workflow dispatched manually without tag. Using Cargo.toml version: v${CARGO_VER}"
            echo "version=v${CARGO_VER}" >> $GITHUB_OUTPUT
            echo "clean_version=${CARGO_VER}" >> $GITHUB_OUTPUT
          fi

  build-release:
    name: Build release (${{ matrix.target }})
    needs: verify-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up sccache
        uses: mozilla/sccache-action@v0.0.8

      - name: Configure sccache
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          targets: ${{ matrix.target }}
          cache-targets: false

      - name: Install Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev build-essential cmake

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

      - name: Package asset & generate completions (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          VERSION="${{ needs.verify-version.outputs.version }}"
          ARCHIVE_VERSION="srz-${VERSION}-${{ matrix.target }}.tar.gz"
          ARCHIVE_LATEST="srz-${{ matrix.target }}.tar.gz"

          STAGE_DIR="staging-${{ matrix.target }}"
          mkdir -p "${STAGE_DIR}/completions"

          cp "target/${{ matrix.target }}/release/srz" "${STAGE_DIR}/"
          cp README.md LICENSE "${STAGE_DIR}/"

          # Generate shell completions using the built release binary
          "${STAGE_DIR}/srz" completions bash > "${STAGE_DIR}/completions/srz.bash"
          "${STAGE_DIR}/srz" completions zsh > "${STAGE_DIR}/completions/_srz"
          "${STAGE_DIR}/srz" completions fish > "${STAGE_DIR}/completions/srz.fish"

          # Create archive with root binary and bundled documentation / completions
          tar -czf "${ARCHIVE_VERSION}" -C "${STAGE_DIR}" srz README.md LICENSE completions
          cp "${ARCHIVE_VERSION}" "${ARCHIVE_LATEST}"

          shasum -a 256 "${ARCHIVE_VERSION}" > "${ARCHIVE_VERSION}.sha256" 2>/dev/null || sha256sum "${ARCHIVE_VERSION}" > "${ARCHIVE_VERSION}.sha256"
          shasum -a 256 "${ARCHIVE_LATEST}" > "${ARCHIVE_LATEST}.sha256" 2>/dev/null || sha256sum "${ARCHIVE_LATEST}" > "${ARCHIVE_LATEST}.sha256"

      - name: Package asset & generate completions (Windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          VERSION="${{ needs.verify-version.outputs.version }}"
          ARCHIVE_VERSION="srz-${VERSION}-${{ matrix.target }}.zip"
          ARCHIVE_LATEST="srz-${{ matrix.target }}.zip"

          STAGE_DIR="staging-${{ matrix.target }}"
          mkdir -p "${STAGE_DIR}/completions"

          cp "target/${{ matrix.target }}/release/srz.exe" "${STAGE_DIR}/"
          cp README.md LICENSE "${STAGE_DIR}/"

          # Generate shell completions using the built release binary
          "./${STAGE_DIR}/srz.exe" completions bash > "${STAGE_DIR}/completions/srz.bash"
          "./${STAGE_DIR}/srz.exe" completions zsh > "${STAGE_DIR}/completions/_srz"
          "./${STAGE_DIR}/srz.exe" completions fish > "${STAGE_DIR}/completions/srz.fish"

          cd "${STAGE_DIR}"
          7z a "../../${ARCHIVE_VERSION}" srz.exe README.md LICENSE completions
          cd ../..
          cp "${ARCHIVE_VERSION}" "${ARCHIVE_LATEST}"

          shasum -a 256 "${ARCHIVE_VERSION}" > "${ARCHIVE_VERSION}.sha256" 2>/dev/null || sha256sum "${ARCHIVE_VERSION}" > "${ARCHIVE_VERSION}.sha256"
          shasum -a 256 "${ARCHIVE_LATEST}" > "${ARCHIVE_LATEST}.sha256" 2>/dev/null || sha256sum "${ARCHIVE_LATEST}" > "${ARCHIVE_LATEST}.sha256"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.target }}
          path: |
            srz-*.tar.gz
            srz-*.zip
            srz-*.sha256
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release & Attestations
    needs: [verify-version, build-release]
    runs-on: ubuntu-latest
    if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && inputs.dry_run != true
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate Consolidated SHA256SUMS
        run: |
          cd dist
          # Compute canonical checksum manifest
          sha256sum srz-*.tar.gz srz-*.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Extract Release Notes from CHANGELOG.md
        id: changelog
        run: |
          VERSION="${{ needs.verify-version.outputs.version }}"
          echo "Extracting release notes for ${VERSION} from docs/CHANGELOG.md..."
          awk -v ver="${VERSION}" '
            $0 ~ "^## " ver { found=1; next }
            found && /^## / { exit }
            found && /^---/ { exit }
            found { print }
          ' docs/CHANGELOG.md > dist/release_notes.md

          if [ -s dist/release_notes.md ]; then
            echo "has_notes=true" >> $GITHUB_OUTPUT
            echo "Extracted release notes successfully:"
            cat dist/release_notes.md
          else
            echo "has_notes=false" >> $GITHUB_OUTPUT
            echo "No custom entry found in CHANGELOG.md for ${VERSION}. Falling back to GitHub auto-generated notes."
          fi

      - name: Generate Artifact Attestations (SLSA Provenance)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/srz-*.tar.gz
            dist/srz-*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify-version.outputs.version }}
          name: Release ${{ needs.verify-version.outputs.version }}
          body_path: ${{ steps.changelog.outputs.has_notes == 'true' && 'dist/release_notes.md' || '' }}
          generate_release_notes: ${{ steps.changelog.outputs.has_notes != 'true' }}
          files: |
            dist/srz-*.tar.gz
            dist/srz-*.zip
            dist/srz-*.sha256
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crates-io:
    name: Publish to Crates.io
    needs: [verify-version, build-release]
    if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && inputs.dry_run != true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up sccache
        uses: mozilla/sccache-action@v0.0.8

      - name: Configure sccache
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev build-essential cmake

      - name: Publish to Crates.io
        run: cargo publish --token ${{ secrets.CRATES_IO_TOKEN }}
        env:
          CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  bump-homebrew:
    name: Bump Homebrew Formula
    needs: [verify-version, build-release, publish-release]
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
    runs-on: ubuntu-latest
    steps:
      - name: Check if HOMEBREW_TAP_TOKEN is configured
        id: check-token
        run: |
          if [ -z "${{ secrets.HOMEBREW_TAP_TOKEN }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::warning::HOMEBREW_TAP_TOKEN secret is not set. Skipping Homebrew formula bump."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Download release assets for checksum extraction
        if: steps.check-token.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Update Homebrew formula in tap
        if: steps.check-token.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${{ needs.verify-version.outputs.clean_version }}"
          TAG="${{ needs.verify-version.outputs.version }}"
          echo "Updating Homebrew tap for srz v${VERSION} (${TAG})..."

          # Read checksums directly from downloaded build artifacts (no polling/download loop)
          SHA_ARM64_MAC=$(awk '{print $1}' dist/srz-${TAG}-aarch64-apple-darwin.tar.gz.sha256 | head -1)
          SHA_X86_LINUX=$(awk '{print $1}' dist/srz-${TAG}-x86_64-unknown-linux-gnu.tar.gz.sha256 | head -1)
          SHA_ARM_LINUX=$(awk '{print $1}' dist/srz-${TAG}-aarch64-unknown-linux-gnu.tar.gz.sha256 | head -1)

          if [ -z "$SHA_ARM64_MAC" ] || [ -z "$SHA_X86_LINUX" ]; then
            echo "::error::Could not extract sha256 checksums from local artifacts."
            exit 1
          fi

          echo "macOS aarch64 SHA256: ${SHA_ARM64_MAC}"
          echo "Linux x86_64  SHA256: ${SHA_X86_LINUX}"
          echo "Linux aarch64 SHA256: ${SHA_ARM_LINUX}"

          # Clone tap repository
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/NewGuy012/homebrew-tap.git" tap
          cd tap

          mkdir -p Formula

          # Generate formula with automated shell completions and multi-arch Linux support
          printf 'class Srz < Formula\n  desc "Fast, modular CLI to summarize webpages, documents, books, and live news using local LLMs"\n  homepage "https://github.com/NewGuy012/srz"\n  version "%s"\n\n  on_macos do\n    on_arm do\n      url "https://github.com/NewGuy012/srz/releases/download/v#{version}/srz-v#{version}-aarch64-apple-darwin.tar.gz"\n      sha256 "%s"\n    end\n  end\n\n  on_linux do\n    on_intel do\n      url "https://github.com/NewGuy012/srz/releases/download/v#{version}/srz-v#{version}-x86_64-unknown-linux-gnu.tar.gz"\n      sha256 "%s"\n    end\n    on_arm do\n      url "https://github.com/NewGuy012/srz/releases/download/v#{version}/srz-v#{version}-aarch64-unknown-linux-gnu.tar.gz"\n      sha256 "%s"\n    end\n  end\n\n  def install\n    bin.install "srz"\n    generate_completions_from_executable(bin/"srz", "completions")\n  end\n\n  test do\n    assert_match "srz", shell_output("#{bin}/srz --version")\n  end\nend\n' "$VERSION" "$SHA_ARM64_MAC" "$SHA_X86_LINUX" "${SHA_ARM_LINUX:-$SHA_X86_LINUX}" > Formula/srz.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TARGET_BRANCH=$(git branch --show-current)
          if [ -z "$TARGET_BRANCH" ]; then
            TARGET_BRANCH="main"
            git checkout -b main
          fi

          git add Formula/srz.rb
          if git diff --staged --quiet; then
            echo "Formula already up-to-date. No changes to commit."
          else
            git commit -m "Update srz formula to v${VERSION}"
            git push origin "$TARGET_BRANCH"
            echo "Successfully updated Formula/srz.rb to v${VERSION} on branch ${TARGET_BRANCH}!"
          fi
