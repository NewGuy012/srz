name: Lint Workflows, Scripts & Docs

on:
  push:
    branches:
      - master
    paths:
      - '.github/**'
      - 'scripts/**'
      - '.githooks/**'
      - 'docs/**'
      - 'README.md'
      - 'book.toml'
  pull_request:
    branches:
      - master
    paths:
      - '.github/**'
      - 'scripts/**'
      - '.githooks/**'
      - 'docs/**'
      - 'README.md'
      - 'book.toml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint-workflows-and-scripts:
    name: Lint Workflows & Scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install lint tools
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: actionlint,zizmor,shellcheck

      - name: Lint GitHub Actions workflows (actionlint)
        run: actionlint

      - name: Audit GitHub Actions workflows (zizmor)
        run: zizmor --offline .

      - name: Lint shell scripts & hooks (shellcheck + syntax)
        run: |
          sh -n scripts/install.sh
          bash -n scripts/release.sh
          bash -n .githooks/pre-commit
          shellcheck scripts/install.sh scripts/release.sh .githooks/pre-commit

      - name: Lint PowerShell installer (PSScriptAnalyzer)
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -ErrorAction Stop
          Invoke-ScriptAnalyzer -Path scripts/install.ps1 -ExcludeRule PSAvoidUsingWriteHost -Severity Error,Warning -EnableExit

  check-doc-links:
    name: Check Documentation Links
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install lychee
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: lychee

      - name: Verify local documentation links
        run: lychee --no-progress --offline --exclude '^file:///Users/' docs/ README.md
