name: Deploy mdBook to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - 'book.toml'
      - 'docs/**'
      - 'theme/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'book.toml'
      - 'docs/**'
      - 'theme/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build mdBook Documentation
    runs-on: ubuntu-24.04
    env:
      MDBOOK_VERSION: "0.5.4"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install mdBook and preprocessors
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@${{ env.MDBOOK_VERSION }},mdbook-mermaid,mdbook-katex

      - name: Verify tools installation
        run: |
          mdbook --version
          mdbook-mermaid --version
          mdbook-katex --version

      - name: Initialize mdbook-mermaid assets
        run: mdbook-mermaid install .

      - name: Build site with mdBook
        run: mdbook build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
