name: Deploy mdBook to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - 'book/**'
      - 'book.toml'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build mdBook Documentation
    runs-on: ubuntu-24.04
    env:
      MDBOOK_VERSION: "0.5.4"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install mdBook
        run: |
          mkdir -p bin
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C bin
          chmod +x bin/mdbook
          echo "$(pwd)/bin" >> $GITHUB_PATH

      - name: Verify mdBook installation
        run: mdbook --version

      - name: Build site with mdBook
        run: mdbook build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
