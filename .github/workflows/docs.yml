name: Deploy mdBook to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - 'book.toml'
      - 'docs/**'
      - 'theme/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'book.toml'
      - 'docs/**'
      - 'theme/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build mdBook Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MDBOOK_VERSION: "0.5.4"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mdBook and preprocessors
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: mdbook@${{ env.MDBOOK_VERSION }},mdbook-mermaid,mdbook-katex

      - name: Verify tools installation
        run: |
          mdbook --version
          mdbook-mermaid --version
          mdbook-katex --version

      - name: Initialize mdbook-mermaid assets
        run: mdbook-mermaid install .

      - name: Build site with mdBook
        run: mdbook build

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./site

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
