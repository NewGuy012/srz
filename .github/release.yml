changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot[bot]
  categories:
    - title: Features
      labels:
        - enhancement
        - feature
    - title: Security
      labels:
        - security
    - title: Bug Fixes
      labels:
        - bug
    - title: Maintenance & Documentation
      labels:
        - documentation
        - dependencies
        - ci
        - chore
