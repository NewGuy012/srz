[package]
name = "srz"
version = "0.2.0"
edition = "2024"
description = "Fast, modular CLI to summarize webpages, documents, books, and live news using local LLMs"
license = "BSD-3-Clause"
repository = "https://github.com/NewGuy012/srz"
homepage = "https://github.com/NewGuy012/srz"
readme = "README.md"
keywords = ["llm", "summarizer", "cli", "news", "ai"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
indicatif = "0.18"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
scraper = "0.29"
html2text = "0.17"
urlencoding = "2.1"
anyhow = "1.0"
duckdb = { version = "1.20000.0", features = ["bundled"] }
clap_complete = "4"
toml = "1.1"
pdf-extract = "0.12.1"
epub = "2.1.5"
self-replace = "1.5"
sha2 = "0.10"
flate2 = "1.0"
tar = "0.4"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
semver = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = true
