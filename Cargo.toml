[package]
name = "srz"
version = "0.7.6"
edition = "2024"
authors = ["Moses Yoo"]
description = "Fast, modular CLI to summarize webpages, documents, books, and live news using local LLMs"
license = "BSD-3-Clause"
repository = "https://github.com/NewGuy012/srz"
homepage = "https://github.com/NewGuy012/srz"
documentation = "https://newguy012.github.io/srz/"
readme = "README.md"
keywords = ["llm", "summarizer", "cli", "news", "ai"]
categories = ["command-line-utilities", "text-processing"]
include = [
    "src/**/*",
    "tests/**/*",
    "assets/document.pdf",
    "Cargo.toml",
    "README.md",
    "LICENSE",
]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
indicatif = "0.18"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
scraper = "0.29"
anyhow = "1.0"
duckdb = { version = "1.20000.1", features = ["bundled"] }
clap_complete = "4"
toml = "1.1"
flate2 = "1.0"
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
termimad = "0.35.5"
ratatui = "0.30.2"
crossterm = "0.29.0"
pdf-extract = "0.12.1"
dom_smoothie = "0.19"
tiktoken-rs = "0.12"
quick-xml = "0.42"
pulldown-cmark = "0.13"
rustyline = "19"
htmd = "0.5.6"

[dev-dependencies]

[lints.clippy]
all = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = true
