[package]
name = "srz"
version = "0.7.9"
edition = "2024"
authors = ["Moses Yoo"]
description = "Fast, modular CLI to summarize webpages, documents, books, and live news using local LLMs"
license = "BSD-3-Clause"
repository = "https://github.com/NewGuy012/srz"
homepage = "https://github.com/NewGuy012/srz"
documentation = "https://newguy012.github.io/srz/"
readme = "README.md"
keywords = ["llm", "summarizer", "cli", "news", "ai"]
categories = ["command-line-utilities", "text-processing"]
include = [
    "src/**/*",
    "tests/**/*",
    "assets/document.pdf",
    "Cargo.toml",
    "README.md",
    "LICENSE",
]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.13", features = ["json", "gzip"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
redb = "4"
toml = "1.1"
flate2 = "1.0"
ratatui = "0.30.2"
crossterm = "0.29.0"
pdf-extract = "0.12.1"
dom_smoothie = "0.19"

[dev-dependencies]

[lints.clippy]
all = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = true
