[package]
name = "srz"
version = "0.7.14"
edition = "2024"
authors = ["Moses Yoo"]
description = "Fast, modular CLI to summarize webpages, documents, books, and live news using local LLMs"
license = "BSD-3-Clause"
repository = "https://github.com/NewGuy012/srz"
documentation = "https://newguy012.github.io/srz/"
readme = "README.md"
keywords = ["llm", "summarizer", "cli", "news", "ai"]
categories = ["command-line-utilities", "text-processing"]
include = [
    "src/**/*",
    "tests/**/*",
    "assets/document.pdf",
    "Cargo.toml",
    "README.md",
    "LICENSE",
]

[dependencies]
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "derive"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["default-tls", "http2", "gzip", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
redb = "5"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
flate2 = "1"
crossterm = { version = "0.29", default-features = false, features = ["events", "windows"] }
pdf-extract = "0.12"
dom_smoothie = "0.20"

[dev-dependencies]

[lints.clippy]
all = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = true
