[package]
name = "srz"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
indicatif = "0.17"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
scraper = "0.22"
html2text = "0.14"
urlencoding = "2.1"
anyhow = "1.0"
duckdb = { version = "1.20000.0", features = ["bundled"] }
clap_complete = "4"
toml = "0.8"
pdf-extract = "0.12.1"
epub = "2.1.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = true
