[book]
authors = ["Moses Yoo"]
language = "en"
title = "srz Documentation"
description = "Fast, modular CLI to summarize webpages, documents, books, and live news using local LLMs"
src = "book/src"

[build]
build-dir = "site"

[output.html]
git-repository-url = "https://github.com/NewGuy012/srz"
edit-url-template = "https://github.com/NewGuy012/srz/edit/master/{path}"
preferred-dark-theme = "coal"
default-theme = "coal"

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
